<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create the admin account | Face Insight</title>
    <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg?v={{ asset_v }}">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32.png?v={{ asset_v }}">
    <link rel="icon" type="image/x-icon" href="/static/img/favicon.ico?v={{ asset_v }}">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/img/apple-touch-icon.png?v={{ asset_v }}">
    {% include "_prepaint.html" %}
    <link rel="stylesheet" href="/static/css/style.css?v={{ asset_v }}">
</head>
<body class="auth-page">
    <main class="auth">
        <div class="auth__brand">
            <img src="/static/img/favicon.svg?v={{ asset_v }}" alt="" width="28" height="28">
            <span>Face Insight</span>
        </div>

        <form class="card auth__panel" method="post" action="/setup">
            <h1 class="auth__title">Create the admin account</h1>
            <p class="auth__lead">There are no accounts yet. This one can sign in, change settings and add other admins.</p>
            {% if error %}<p class="modal-error" role="alert">{{ error }}</p>{% endif %}
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input id="username" name="username" class="form-input" autocomplete="username"
                       value="{{ username }}" required autofocus pattern="[A-Za-z0-9._\-]{3,32}"
                       aria-describedby="usernameHint">
                <p class="form-hint" id="usernameHint">3 to 32 characters: letters, numbers, dot, dash or underscore.</p>
            </div>
            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input id="password" name="password" type="password" class="form-input"
                       autocomplete="new-password" required minlength="8" aria-describedby="passwordHint">
                <p class="form-hint" id="passwordHint">At least 8 characters.</p>
            </div>
            <div class="form-group">
                <label for="confirm" class="form-label">Password again</label>
                <input id="confirm" name="confirm" type="password" class="form-input"
                       autocomplete="new-password" required minlength="8">
            </div>
            <button type="submit" class="btn btn--primary auth__submit">Create account</button>
        </form>
    </main>
</body>
</html>
