<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | Face Insight</title>
    <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg?v={{ asset_v }}">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32.png?v={{ asset_v }}">
    <link rel="icon" type="image/x-icon" href="/static/img/favicon.ico?v={{ asset_v }}">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/img/apple-touch-icon.png?v={{ asset_v }}">
    {% include "_prepaint.html" %}
    <link rel="stylesheet" href="/static/css/style.css?v={{ asset_v }}">
</head>
<body class="auth-page">
    <main class="auth">
        <div class="auth__brand">
            <img src="/static/img/favicon.svg?v={{ asset_v }}" alt="" width="28" height="28">
            <span>Face Insight</span>
        </div>

        <form class="card auth__panel" method="post" action="/login">
            <h1 class="auth__title">Sign in</h1>
            {% if error %}<p class="modal-error" role="alert">{{ error }}</p>{% endif %}
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input id="username" name="username" class="form-input" autocomplete="username"
                       value="{{ username }}" required{% if not username %} autofocus{% endif %}>
            </div>
            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input id="password" name="password" type="password" class="form-input"
                       autocomplete="current-password" required{% if username %} autofocus{% endif %}>
            </div>
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="btn btn--primary auth__submit">Sign in</button>
        </form>

        <p class="auth__note">New accounts are added by an admin in Settings.</p>
    </main>
</body>
</html>
